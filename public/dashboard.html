<!DOCTYPE html>
<html lang="en">

<head>

    <link rel="stylesheet" href="/style.css">
</head>

        <h1>Welcome to Student Portal</h1>

        <div class="course-list">

            </div>

            </div>
            <div class="course-card"onclick="window.location.href='/course_details.html?course=CSS'">
